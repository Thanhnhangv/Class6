hung của 18 và 24?",options:["2","3","6","9"],correctAnswer:"3",explanation:"18 chia hết cho 9 nhưng 24 không chia hết cho 9 (24 : 9 = 2 dư 6). Do đó 9 không thuộc ƯC(18, 24).",level:"nhan_biet",skill:"tim_uoc_chung",commonMistake:"Chỉ kiểm tra tính chia hết của một số đầu tiên (18) mà quên kiểm tra số thứ hai (24).",hint:"Ước chung phải là số mà CẢ HAI số 18 và 24 đều chia hết.",points:10,type:"multiple_choice"},{id:"q_nb_03",content:"Ký hiệu ƯC(a, b) dùng để chỉ:",options:["Bội chung của a và b","Ước chung lớn nhất của a và b","Tập hợp các ước chung của a và b","Tích của a và b"],correctAnswer:"2",explanation:"ƯC(a, b) là ký hiệu của Tập hợp các ước chung của hai số a và b.",level:"nhan_biet",skill:"tim_uoc_chung",commonMistake:"Nhầm lẫn giữa ƯC (tập hợp ước chung) và ƯCLN (ước chung lớn nhất - là một số duy nhất).",hint:"Chữ 'ƯC' viết tắt của Ước Chung, đại diện cho một tập hợp các số.",points:10,type:"multiple_choice"},{id:"q_nb_04",content:"Số lớn nhất trong tập hợp các ước chung của a và b được gọi là:",options:["Ước chung lớn nhất (ƯCLN)","Bội chung nhỏ nhất (BCNN)","Ước riêng lớn nhất","Thừa số nguyên tố chung"],correctAnswer:"0",explanation:"Ước chung lớn nhất của hai hay nhiều số là số lớn nhất trong tập hợp các ước chung của các số đó.",level:"nhan_biet",skill:"tim_ucln_liet_ke",commonMistake:"Nhầm lẫn giữa khái niệm ƯCLN và BCNN.",hint:"Chú ý từ 'lớn nhất' trong tập các 'ước chung'.",points:10,type:"multiple_choice"},{id:"q_nb_05",content:"ƯCLN của mọi số tự nhiên a (khác 0) với 1 bằng:",options:["a","1","0","Không xác định"],correctAnswer:"1",explanation:"Vì Ư(1) = {1} nên với mọi số a ≠ 0, ta luôn có ƯCLN(a, 1) = 1.",level:"nhan_biet",skill:"tim_ucln_liet_ke",commonMistake:"Nghĩ rằng ƯCLN phải bằng số lớn hơn (chọn a).",hint:"Số 1 chỉ có duy nhất một ước là 1, nên ước chung lớn nhất không thể vượt quá 1.",points:10,type:"multiple_choice"},{id:"q_nb_06",content:"Hai số nguyên tố cùng nhau là hai số có:",options:["ƯCLN bằng 0","Tổng là một số nguyên tố","Cả hai số đều là số nguyên tố","ƯCLN bằng 1"],correctAnswer:"3",explanation:"Định nghĩa: Hai số có ước chung lớn nhất bằng 1 được gọi là hai số nguyên tố cùng nhau.",level:"nhan_biet",skill:"so_nguyen_to_cung_nhau",commonMistake:"Hiểu lầm rằng hai số nguyên tố cùng nhau thì bắt buộc cả hai số đều phải là số nguyên tố (ví dụ 8 và 9 là hợp số nhưng vẫn nguyên tố cùng nhau).",hint:"Hai số nguyên tố cùng nhau chỉ có duy nhất ước chung là 1.",points:10,type:"multiple_choice"},{id:"q_nb_07",content:"Trong các cặp số sau, cặp số nào là hai số nguyên tố cùng nhau?",options:["6 và 8","12 và 18","8 và 9","15 và 20"],correctAnswer:"2",explanation:"Ư(8) = {1; 2; 4; 8}, Ư(9) = {1; 3; 9} -> ƯC(8, 9) = {1} -> ƯCLN(8, 9) = 1 nên 8 và 9 nguyên tố cùng nhau.",level:"nhan_biet",skill:"so_nguyen_to_cung_nhau",commonMistake:"Loại bỏ 8 và 9 vì nghĩ chúng là hợp số.",hint:"Tìm cặp số mà chúng không cùng chia hết cho bất kỳ số nào khác ngoài số 1.",points:10,type:"multiple_choice"},{id:"q_nb_08",content:"Nếu a chia hết cho b (a ⋮ b) thì ƯCLN(a, b) bằng:",options:["b","a","1","a · b"],correctAnswer:"0",explanation:"Khi a ⋮ b, thì b là ước của a và b cũng là ước lớn nhất của chính nó, do đó ƯCLN(a, b) = b.",level:"nhan_biet",skill:"tim_ucln_liet_ke",commonMistake:"Nhầm chọn số lớn hơn (a).",hint:"Ví dụ 12 ⋮ 4 thì ƯCLN(12, 4) chính là số nhỏ hơn: 4.",points:10,type:"multiple_choice"},{id:"q_nb_09",content:"Tập hợp các ước chung của 10 và 15 là:",options:["{1; 2; 5}","{1; 5}","{5}","{1; 5; 10; 15}"],correctAnswer:"1",explanation:"Ư(10) = {1; 2; 5; 10}, Ư(15) = {1; 3; 5; 15}. Phần tử chung là {1; 5}.",level:"nhan_biet",skill:"tim_uoc_chung",commonMistake:"Chỉ chọn số 5 mà quên liệt kê số 1.",hint:"Số 1 luôn là ước chung của mọi cặp số tự nhiên.",points:10,type:"multiple_choice"},{id:"q_nb_10",content:"Khi phân tích ra thừa số nguyên tố, nếu a = 2² · 3 và b = 2 · 3² thì thừa số nguyên tố CHUNG là:",options:["Chỉ có 2","Chỉ có 3","2² và 3²","2 và 3"],correctAnswer:"3",explanation:"Cả a và b đều chứa các cơ số nguyên tố chung là 2 và 3.",level:"nhan_biet",skill:"tim_ucln_tsnt",commonMistake:"Nhầm lẫn giữa cơ số (thừa số nguyên tố) và lũy thừa.",hint:"Nhìn vào các cơ số xuất hiện ở cả hai biểu thức phân tích.",points:10,type:"multiple_choice"},{id:"q_th_01",content:"Biết Ư(16) = {1; 2; 4; 8; 16} và Ư(24) = {1; 2; 3; 4; 6; 8; 12; 24}. Khi đó ƯCLN(16, 24) là:",options:["4","2","8","16"],correctAnswer:"2",explanation:"ƯC(16, 24) = {1; 2; 4; 8}. Số lớn nhất trong tập hợp này là 8. Do đó ƯCLN(16, 24) = 8.",level:"thong_hieu",skill:"tim_ucln_liet_ke",commonMistake:"Chọn 4 (ước chung nhưng chưa lớn nhất) hoặc chọn 16 (chỉ là ước của 16, không là ước của 24).",hint:"Tìm số to nhất xuất hiện đồng thời trong cả hai tập hợp ước.",points:15,type:"multiple_choice"},{id:"q_th_02",content:"Cho a = 2³ · 3 · 5 và b = 2² · 3² · 7. ƯCLN(a, b) bằng:",options:["2³ · 3² · 5 · 7","2² · 3 = 12","2³ · 3² = 72","2 · 3 = 6"],correctAnswer:"1",explanation:"Thừa số nguyên tố chung là 2 và 3. Số mũ nhỏ nhất của 2 là 2, của 3 là 1. Do đó ƯCLN(a, b) = 2² · 3 = 4 · 3 = 12.",level:"thong_hieu",skill:"tim_ucln_tsnt",commonMistake:"Lấy số mũ lớn nhất (nhầm với quy tắc tìm BCNN) hoặc lấy cả thừa số riêng 5 và 7.",hint:"Quy tắc tìm ƯCLN: Lập tích các thừa số nguyên tố CHUNG, mỗi thừa số lấy với số mũ NHỎ NHẤT.",points:15,type:"multiple_choice"},{id:"q_th_03",content:"Mối quan hệ giữa tập hợp ƯC(a, b) và tập hợp các ước của ƯCLN(a, b) là gì?",options:["ƯCLN(a, b) không chia hết cho các ước chung của a và b","Tập hợp ƯC(a, b) luôn nhiều phần tử hơn tập Ư(ƯCLN(a, b))","Không có mối liên hệ nào","Tất cả các ước chung của a và b đều là ước của ƯCLN(a, b)"],correctAnswer:"3",explanation:"Định lý quan trọng: Mọi ước chung của hai hay nhiều số đều là ước của ước chung lớn nhất của chúng. Tức là ƯC(a, b) = Ư(ƯCLN(a, b)).",level:"thong_hieu",skill:"tim_uoc_chung",commonMistake:"Không nhận ra tính chất bắc cầu giúp tìm ƯC thông qua ƯCLN một cách nhanh chóng.",hint:"Sau khi tìm được ƯCLN, muốn tìm ƯC ta chỉ việc tìm tập ước của số ƯCLN đó.",points:15,type:"multiple_choice"},{id:"q_th_04",content:"Biết ƯCLN(a, b) = 18. Tập hợp các ước chung của a và b là:",options:["{1; 2; 3; 6; 9; 18}","{18; 36; 54; ...}","{1; 2; 3; 6; 18}","{2; 3; 6; 9; 18}"],correctAnswer:"0",explanation:"Vì ƯC(a, b) = Ư(ƯCLN(a, b)) = Ư(18) = {1; 2; 3; 6; 9; 18}.",level:"thong_hieu",skill:"tim_uoc_chung",commonMistake:"Quên ước số 9 của 18 hoặc nhầm sang tập bội.",hint:"Tìm tập hợp tất cả các ước của số 18.",points:15,type:"multiple_choice"},{id:"q_th_05",content:"Tìm ƯCLN(30, 45, 75):",options:["5","3","15","30"],correctAnswer:"2",explanation:"30 = 2 · 3 · 5; 45 = 3² · 5; 75 = 3 · 5². Các thừa số chung là 3 và 5 với số mũ nhỏ nhất là 1. ƯCLN = 3 · 5 = 15.",level:"thong_hieu",skill:"tim_ucln_tsnt",commonMistake:"Chỉ lấy thừa số 5 mà bỏ sót thừa số 3, chọn đáp án 5.",hint:"Phân tích 30, 45, 75 ra thừa số nguyên tố rồi tìm các thừa số chung có số mũ nhỏ nhất.",points:15,type:"multiple_choice"},{id:"q_th_06",content:"Rút gọn phân số 36/48 về phân số tối giản bằng cách chia cả tử và mẫu cho ƯCLN(36, 48). Ta được:",options:["6/8","3/4","9/12","18/24"],correctAnswer:"1",explanation:"ƯCLN(36, 48) = 12. Chia cả tử và mẫu cho 12: 36:12 / 48:12 = 3/4.",level:"thong_hieu",skill:"rut_gon_phan_so",commonMistake:"Chỉ chia cho 6 được 6/8 (chưa phải phân số tối giản).",hint:"Muốn rút gọn 1 bước về tối giản, ta chia cả tử và mẫu cho ƯCLN của chúng.",points:15,type:"multiple_choice"},{id:"q_th_07",content:"Phân số nào sau đây đã là phân số tối giản?",options:["14/21","15/25","18/27","7/12"],correctAnswer:"3",explanation:"ƯCLN(7, 12) = 1 nên 7/12 là phân số tối giản. Các phân số còn lại tử và mẫu có ƯCLN > 1.",level:"thong_hieu",skill:"rut_gon_phan_so",commonMistake:"Nghĩ rằng cả tử và mẫu đều phải là số nguyên tố mới tối giản.",hint:"Phân số tối giản là phân số có tử và mẫu là hai số nguyên tố cùng nhau (ƯCLN = 1).",points:15,type:"multiple_choice"},{id:"q_th_08",content:"Tìm số tự nhiên x lớn nhất biết 48 ⋮ x và 72 ⋮ x:",options:["24","12","6","48"],correctAnswer:"0",explanation:"Vì 48 ⋮ x và 72 ⋮ x nên x ∈ ƯC(48, 72). Do x lớn nhất nên x = ƯCLN(48, 72) = 24.",level:"thong_hieu",skill:"tim_ucln_tsnt",commonMistake:"Chọn 12 vì nhầm 12 là số lớn nhất chia hết cho cả hai.",hint:"48 = 2⁴ · 3 và 72 = 2³ · 3² -> ƯCLN = 2³ · 3 = 8 · 3 = 24.",points:15,type:"multiple_choice"},{id:"q_vd_01",content:"Cô giáo muốn chia 48 quyển vở và 36 bút chì thành các phần thưởng đều nhau. Hỏi cô có thể chia nhiều nhất thành bao nhiêu phần thưởng?",options:["6 phần thưởng","24 phần thưởng","12 phần thưởng","4 phần thưởng"],correctAnswer:"2",explanation:"Số phần thưởng nhiều nhất chính là ƯCLN(48, 36). Ta có 48 = 2⁴ · 3; 36 = 2² · 3² -> ƯCLN(48, 36) = 2² · 3 = 12 phần thưởng.",level:"van_dung",skill:"ung_dung_thuc_te",commonMistake:"Chọn 6 phần thưởng (chia được nhưng chưa phải số phần thưởng NHIỀU NHẤT).",hint:"Bài toán chia đồ vật thành số phần nhiều nhất chính là bài toán tìm ƯCLN.",points:20,type:"multiple_choice"},{id:"q_vd_02",content:"Một lớp học có 24 bạn nam và 20 bạn nữ. Thầy giáo muốn chia lớp thành các nhóm sao cho số nam và nữ ở mỗi nhóm đều bằng nhau. Có thể chia được nhiều nhất bao nhiêu nhóm?",options:["2 nhóm","4 nhóm","6 nhóm","8 nhóm"],correctAnswer:"1",explanation:"Số nhóm nhiều nhất là ƯCLN(24, 20). 24 = 2³ · 3; 20 = 2² · 5 -> ƯCLN(24, 20) = 2² = 4 nhóm (mỗi nhóm có 6 nam và 5 nữ).",level:"van_dung",skill:"ung_dung_thuc_te",commonMistake:"Lấy tổng 44 chia cho các số ngẫu nhiên hoặc nhầm lấy ước của 24.",hint:"Số nhóm phải là ước chung của 24 và 20, và vì là 'nhiều nhất' nên là ƯCLN(24, 20).",points:20,type:"multiple_choice"},{id:"q_vd_03",content:"Một tấm bìa hình chữ nhật có chiều dài 60 cm và chiều rộng 48 cm. Bạn Minh muốn cắt thành các hình vuông nhỏ bằng nhau sao cho không thừa bìa. Độ dài cạnh hình vuông lớn nhất là:",options:["6 cm","4 cm","24 cm","12 cm"],correctAnswer:"3",explanation:"Để không thừa bìa và cạnh hình vuông lớn nhất, độ dài cạnh phải là ƯCLN(60, 48) = 12 cm.",level:"van_dung",skill:"ung_dung_thuc_te",commonMistake:"Chọn 6 cm (cắt được nhưng chưa phải kích thước hình vuông lớn nhất).",hint:"Cạnh hình vuông phải là ước chung của cả chiều dài 60cm và chiều rộng 48cm.",points:20,type:"multiple_choice"},{id:"q_vd_04",content:"Tìm số tự nhiên a lớn nhất thỏa mãn: 126 ⋮ a và 210 ⋮ a:",options:["42","21","14","6"],correctAnswer:"0",explanation:"126 = 2 · 3² · 7; 210 = 2 · 3 · 5 · 7 -> a = ƯCLN(126, 210) = 2 · 3 · 7 = 42.",level:"van_dung",skill:"tim_ucln_tsnt",commonMistake:"Quên nhân thừa số 7 hoặc thừa số 2 khi tính tích các thừa số chung.",hint:"Thừa số chung là 2, 3, 7. Lấy số mũ nhỏ nhất là 1.",points:20,type:"multiple_choice"},{id:"q_vd_05",content:"Đội văn nghệ có 36 bạn nữ và 48 bạn nam. Dự định chia thành các tổ có số nam và nữ bằng nhau. Khi số tổ là lớn nhất, mỗi tổ có bao nhiêu bạn nữ và bao nhiêu bạn nam?",options:["4 bạn nữ và 3 bạn nam","6 bạn nữ và 8 bạn nam","3 bạn nữ và 4 bạn nam","2 bạn nữ và 3 bạn nam"],correctAnswer:"2",explanation:"Số tổ lớn nhất là ƯCLN(36, 48) = 12 tổ. Khi đó mỗi tổ có: 36 : 12 = 3 nữ và 48 : 12 = 4 nam.",level:"van_dung",skill:"ung_dung_thuc_te",commonMistake:"Nhầm lẫn giữa số tổ (12) và số học sinh trong mỗi tổ, hoặc đảo ngược số nam và nữ.",hint:"Tìm số tổ lớn nhất (ƯCLN) trước, sau đó lấy tổng số nam/nữ chia cho số tổ.",points:20,type:"multiple_choice"},{id:"q_vd_06",content:"Tìm các ước chung của 72 và 90 có giá trị lớn hơn 5:",options:["{9; 18}","{6; 9; 18}","{6; 18}","{1; 2; 3; 6; 9; 18}"],correctAnswer:"1",explanation:"ƯCLN(72, 90) = 18 -> ƯC(72, 90) = Ư(18) = {1; 2; 3; 6; 9; 18}. Các số lớn hơn 5 là 6; 9; 18.",level:"van_dung",skill:"tim_uoc_chung",commonMistake:"Liệt kê toàn bộ ước chung mà bỏ qua điều kiện 'lớn hơn 5'.",hint:"Tìm ƯCLN(72, 90) = 18, liệt kê các ước của 18 rồi lọc ra các số > 5.",points:20,type:"multiple_choice"},{id:"q_vd_07",content:"Bác nông dân thu hoạch được 108 quả cam và 144 quả táo. Bác muốn xếp đều vào các thùng sao cho mỗi thùng có số quả mỗi loại bằng nhau. Hỏi có thể xếp nhiều nhất bao nhiêu thùng?",options:["18 thùng","12 thùng","24 thùng","36 thùng"],correctAnswer:"3",explanation:"108 = 2² · 3³; 144 = 2⁴ · 3² -> ƯCLN(108, 144) = 2² · 3² = 4 · 9 = 36 thùng.",level:"van_dung",skill:"ung_dung_thuc_te",commonMistake:"Tính sai lũy thừa của 2 và 3 dẫn đến kết quả 18 hoặc 12.",hint:"Số thùng nhiều nhất là ƯCLN(108, 144).",points:20,type:"multiple_choice"},{id:"q_vd_08",content:"Cho hai số a và b. Nếu ƯCLN(a, b) = 15 thì số nào sau đây CHẮC CHẮN là ước chung của a và b?",options:["5","10","30","45"],correctAnswer:"0",explanation:"Mọi ước của ƯCLN(a, b) đều là ước chung của a và b. Vì Ư(15) = {1; 3; 5; 15} nên 5 chắc chắn là ước chung.",level:"van_dung",skill:"tim_uoc_chung",commonMistake:"Chọn 30 hoặc 45 vì nhầm ước của 15 với bội của 15.",hint:"Ước chung phải là ước của 15 (số chia hết cho nó).",points:20,type:"multiple_choice"},{id:"q_vdc_01",content:"Tìm số tự nhiên n lớn nhất sao cho 148 chia cho n dư 20 và 108 chia cho n dư 12:",options:["64","16","32","24"],correctAnswer:"2",explanation:"Vì 148 : n dư 20 -> (148 - 20) ⋮ n -> 128 ⋮ n và n > 20. Vì 108 : n dư 12 -> (108 - 12) ⋮ n -> 96 ⋮ n. Do đó n = ƯCLN(128, 96) = 32 (thỏa mãn n > 20).",level:"van_dung_cao",skill:"tim_ucln_tsnt",commonMistake:"Quên trừ số dư trước khi tìm ước chung hoặc quên điều kiện n > số dư (n > 20).",hint:"Nếu a chia n dư r thì (a - r) chia hết cho n với điều kiện n > r.",points:25,type:"multiple_choice"},{id:"q_vdc_02",content:"Tìm số tự nhiên a lớn nhất thỏa mãn: (2n + 1) và (3n + 1) cùng chia hết cho a với mọi số tự nhiên n:",options:["2","1","3","Không tồn tại"],correctAnswer:"1",explanation:"Gọi d là ước chung của 2n + 1 và 3n + 1 -> 3(2n + 1) ⋮ d và 2(3n + 1) ⋮ d -> (6n + 3) - (6n + 2) ⋮ d -> 1 ⋮ d -> d = 1. Vậy ƯCLN = 1.",level:"van_dung_cao",skill:"so_nguyen_to_cung_nhau",commonMistake:"Nghĩ rằng ƯCLN phụ thuộc vào giá trị cụ thể của n và không biết cách triệt tiêu biến n.",hint:"Nhân (2n + 1) với 3 và nhân (3n + 1) với 2 rồi lấy hiệu để triệt tiêu n.",points:25,type:"multiple_choice"},{id:"q_vdc_03",content:"Một mảnh vườn hình chữ nhật có kích thước 105m × 75m. Người ta muốn trồng cây xung quanh vườn sao cho khoảng cách giữa hai cây liên tiếp là như nhau và ở mỗi góc vườn đều có một cây. Khoảng cách lớn nhất giữa hai cây liên tiếp là:",options:["5 m","3 m","25 m","15 m"],correctAnswer:"3",explanation:"Khoảng cách lớn nhất giữa hai cây phải là ƯCLN(105, 75). 105 = 3 · 5 · 7; 75 = 3 · 5² -> ƯCLN = 3 · 5 = 15m.",level:"van_dung_cao",skill:"ung_dung_thuc_te",commonMistake:"Tính chu vi rồi chia thay vì tìm ƯCLN của chiều dài và chiều rộng.",hint:"Khoảng cách giữa hai cây phải chia hết cả chiều dài 105m và chiều rộng 75m.",points:25,type:"multiple_choice"},{id:"q_vdc_04",content:"Tìm hai số tự nhiên a và b (a < b) biết rằng a + b = 96 và ƯCLN(a, b) = 12:",options:["(a, b) ∈ {(12; 84), (36; 60)}","(a, b) ∈ {(24; 72), (48; 48)}","(a, b) ∈ {(12; 84)}","(a, b) ∈ {(12; 84), (24; 72), (36; 60)}"],correctAnswer:"0",explanation:"Vì ƯCLN(a,b) = 12 nên đặt a = 12x, b = 12y với ƯCLN(x, y) = 1 và x < y. Ta có 12x + 12y = 96 -> x + y = 8. Cặp (x, y) nguyên tố cùng nhau là (1, 7) và (3, 5). Suy ra (a, b) = (12, 84) hoặc (36, 60). Cặp (2, 6) loại vì ƯCLN(2,6)=2.",level:"van_dung_cao",skill:"tim_ucln_liet_ke",commonMistake:"Lấy cả cặp x = 2, y = 6 (dẫn đến ƯCLN(24, 72) = 24 ≠ 12).",hint:"Đặt a = 12x, b = 12y với x, y là hai số nguyên tố cùng nhau (ƯCLN(x,y)=1).",points:25,type:"multiple_choice"},{id:"q_vdc_05",content:"Chứng minh rằng với mọi số tự nhiên n, phân số (n + 1) / (2n + 3) luôn là phân số tối giản vì:",options:["Tử số luôn nhỏ hơn mẫu số","Mẫu số luôn là số lẻ","ƯCLN(n + 1, 2n + 3) = 1","Tử số và mẫu số không cùng chia hết cho 2"],correctAnswer:"2",explanation:"Gọi d là ước chung của n + 1 và 2n + 3 -> 2(n + 1) ⋮ d và (2n + 3) ⋮ d -> (2n + 3) - (2n + 2) = 1 ⋮ d -> d = 1. Do ƯCLN = 1 nên phân số luôn tối giản.",level:"van_dung_cao",skill:"so_nguyen_to_cung_nhau",commonMistake:"Chọn đáp án cảm tính như 'tử nhỏ hơn mẫu' hoặc 'mẫu là số lẻ'.",hint:"Để chứng minh phân số tối giản, ta chứng minh ƯCLN của tử và mẫu bằng 1.",points:25,type:"multiple_choice"},{id:"q_vdc_06",content:"Số học sinh của một trường khi xếp hàng 12, hàng 15, hàng 18 đều vừa đủ. Biết số học sinh trong khoảng từ 300 đến 400 em. Số học sinh của trường là:",options:["320 học sinh","380 học sinh","350 học sinh","360 học sinh"],correctAnswer:"3",explanation:"Gọi số học sinh là a (300 ≤ a ≤ 400). Vì a chia hết cho cả 12, 15, 18 nên a ∈ BC(12, 15, 18). Ta có BCNN(12, 15, 18) = 180 -> BC = {0; 180; 360; 540;...}. Vì 300 ≤ a ≤ 400 nên a = 360 học sinh.",level:"van_dung_cao",skill:"ung_dung_thuc_te",commonMistake:"Nhầm lẫn giữa tìm ước chung và bội chung trong các bài toán xếp hàng thực tế.",hint:"Số học sinh phải chia hết cho cả 12, 15 và 18, tức là bội chung của 12, 15, 18.",points:25,type:"multiple_choice"}],zE=[{id:"badge_explorer",name:"Nhà khám phá",description:"Hoàn thành các hoạt động khám phá hình thành tập hợp Ước & Ước chung",icon:"🏅",isUnlocked:!1},{id:"badge_detective",name:"Thám tử Toán học",description:"Giải mã thành công các mật mã Ước chung trong Biệt đội thám tử",icon:"🔎",isUnlocked:!1},{id:"badge_gcd_master",name:"Cao thủ ƯCLN",description:"Làm chủ phương pháp phân tích thừa số nguyên tố tìm ƯCLN",icon:"🧠",isUnlocked:!1},{id:"badge_perseverance",name:"Chiến binh kiên trì",description:"Không nản lòng trước câu hỏi khó, tự sửa sai và tiến bộ vượt bậc",icon:"🔥",isUnlocked:!1},{id:"badge_conqueror",name:"Chinh phục Toán 6",description:"Đạt chuẩn 100% bài đánh giá cuối bài và nhận Giấy chứng nhận hoàn thành",icon:"🏆",isUnlocked:!1}],ni={tim_uoc:"Xác định ước của một số",tim_uoc_chung:"Tìm tập hợp Ước chung",tim_ucln_liet_ke:"Tìm ƯCLN bằng cách liệt kê ước",tim_ucln_tsnt:"Tìm ƯCLN bằng phân tích ra thừa số nguyên tố",ucln_dac_biet:"Trường hợp đặc biệt và mẹo tính nhanh",so_nguyen_to_cung_nhau:"Nhận biết số nguyên tố cùng nhau",ung_dung_thuc_te:"Giải bài toán thực tế bằng ƯCLN",rut_gon_phan_so:
